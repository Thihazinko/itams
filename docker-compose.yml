services:
  app:
    build:
      context: .
      target: app
    image: infra-ninja-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
      # Share the app's storage volume so nginx can serve uploaded files
      # (avatars under storage/app/public) at /storage/...
      - storage:/var/www/html/storage:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  queue:
    image: infra-ninja-app:latest
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    env_file: .env
    environment:
      # Migrations run only in the app container; skip here to avoid racing it.
      RUN_MIGRATIONS: "false"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  # Runs the Laravel scheduler (schedule:work invokes schedule:run every
  # minute). Drives the daily app:check-expirations reminder job defined in
  # routes/console.php — without this, no expiry reminder emails are sent.
  scheduler:
    image: infra-ninja-app:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment:
      # Migrations run only in the app container; skip here to avoid racing it.
      RUN_MIGRATIONS: "false"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  dbdata:
  storage:
